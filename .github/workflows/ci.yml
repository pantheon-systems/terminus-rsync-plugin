name: Terminus Rsync Plugin
on: push
jobs:
  checkout_lint:
    runs-on: ubuntu-latest
    name: Checkout & lint
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Full Composer Install
        run: composer install
      - name: Install phpcs
        run: composer install-phpcs
      - name: Validate Code
        run: composer cs
      - name: Lint
        run: composer lint
      - name: Deprecations check
        run: composer deprecations

  phpcompatibility:
    runs-on: ubuntu-latest
    name: PHP Compatibility
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: PHPCompatibility
        uses: pantheon-systems/phpcompatibility-action@6bcfb79e78f644a471e856a1e92e14148a8e4017 # v1.1.4
        with:
          test-versions: 7.4-

  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        php-versions: ['7.4', '8.2']
    name: Test (PHP ${{ matrix.php-versions }})
    needs: [ checkout_lint ]
    env:
      TERMINUS_TOKEN: ${{ secrets.TERMINUS_TOKEN }}
      TERMINUS_SITE: ${{ secrets.TERMINUS_SITE }}
      BASH_ENV: ~/.bashrc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup PHP with PECL extension
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-versions }}
      - name: Full Composer Install
        run: composer install
      - name: Install Terminus
        uses: pantheon-systems/terminus-github-actions@34305c662bb28fb2935aa5556cab46643a0c5170 # v1.2.11
        with:
          pantheon-machine-token: ${{ secrets.TERMINUS_TOKEN }}
      - name: Setup environment
        run: chmod +x ./.ci/set-up-globals.sh && ./.ci/set-up-globals.sh
      - name: Check Terminus version
        run: terminus --version
      - name: Install plugin
        run: terminus self:plugin:install .
      - name: Install SSH key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2.8.1
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: unnecessary
      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@2104b40bb7b6c2d5110b23a26b0bf265ab8027db # 3.0.0 2024-09-29T11:05:33Z
      - name: Run tests
        run: composer bats
